<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Prasanna Pet Care Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --premium-bg: #07111E;
            --premium-card: rgba(13, 26, 43, 0.76);
            --premium-surface: rgba(19, 35, 56, 0.86);
            --premium-border: rgba(255, 255, 255, 0.08);
            --premium-gold: #d4a017;
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(212, 160, 23, 0.14), transparent 30%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.10), transparent 26%),
                linear-gradient(180deg, #0d1727 0%, var(--premium-bg) 100%);
            color: #e5e7eb;
        }
        .premium-grid {
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 34px 34px;
        }
        .premium-card {
            background: var(--premium-card);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid var(--premium-border);
            box-shadow: 0 20px 60px -24px rgba(0, 0, 0, 0.8), 0 0 45px -18px rgba(212, 160, 23, 0.20);
        }
        .premium-input {
            background: var(--premium-surface);
            border: 1px solid rgba(212, 160, 23, 0.18);
        }
        .premium-input:focus {
            outline: none;
            border-color: rgba(212, 160, 23, 0.7);
            box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.12);
        }
        .gold-button {
            background: linear-gradient(135deg, #f4c95c, #b88412);
            box-shadow: 0 16px 40px -18px rgba(212, 160, 23, 0.65);
        }
    </style>
</head>
<body class="min-h-screen premium-grid text-gray-200 flex items-center justify-center px-4 py-10">
    <div class="absolute top-10 left-1/2 h-64 w-64 -translate-x-1/2 rounded-full bg-amber-400/10 blur-3xl"></div>
    <div class="absolute bottom-8 right-8 h-72 w-72 rounded-full bg-sky-400/10 blur-3xl"></div>
    <div class="w-full max-w-md premium-card rounded-[2rem] p-8 relative overflow-hidden">
        <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-[#f4c95c] to-transparent"></div>
        <div class="text-center mb-6 relative z-10">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-[#d4a017]/15 text-3xl text-[#f4c95c] shadow-[0_0_30px_rgba(212,160,23,0.28)]">🐾</div>
            <h1 class="mt-5 text-2xl font-bold text-white">Admin Access</h1>
            <p class="mt-2 text-sm text-gray-400">Authorized admins only</p>
        </div>
        {% if error %}
        <div class="mb-4 rounded-xl border border-rose-400/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-300">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login" class="space-y-4">
            <div>
                <label class="mb-2 block text-xs font-bold uppercase tracking-[0.25em] text-gray-300">Username</label>
                <input type="text" name="username" required autocomplete="username" class="premium-input w-full rounded-2xl px-4 py-3.5 text-white placeholder-gray-500 transition-all" placeholder="Enter admin username">
            </div>
            <div>
                <label class="mb-2 block text-xs font-bold uppercase tracking-[0.25em] text-gray-300">Password</label>
                <input type="password" name="password" required autocomplete="current-password" class="premium-input w-full rounded-2xl px-4 py-3.5 text-white placeholder-gray-500 transition-all" placeholder="Enter password">
            </div>
            <button type="submit" class="gold-button w-full rounded-2xl px-4 py-3.5 font-extrabold text-[#0B1320] transition-transform duration-300 hover:-translate-y-0.5">Login</button>
        </form>
    </div>
</body>
</html>
